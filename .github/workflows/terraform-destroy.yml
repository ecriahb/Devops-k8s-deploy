name: Destroy - CloudOps Azure Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: agentic-devops-rg
  TF_DIR: ./cloudops-tf
  TFSTATE_DIR: ./cloudops-tf/bootstrap
  TFSTATE_RG: agentic-tfstate-rg
  TFSTATE_STORAGE: agenticdevopstfstate
  TFSTATE_CONTAINER: tfstate

jobs:

  # ============================================================
  # STAGE 1 - DESTROY MAIN TERRAFORM INFRA
  # ============================================================
  terraform-destroy:
    name: "1️⃣ Destroy CloudOps Infrastructure"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false

      - name: Terraform Destroy Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -input=false \
            -destroy

      - name: Terraform Destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform destroy \
            -input=false \
            -auto-approve

  # ============================================================
  # STAGE 2 - DESTROY BOOTSTRAP TERRAFORM STATE
  # ============================================================
  bootstrap-destroy:
    name: "2️⃣ Destroy Terraform State Storage"
    needs: terraform-destroy
    if: ${{ needs.terraform-destroy.result == 'success' }}
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Bootstrap Terraform Init
        working-directory: ${{ env.TFSTATE_DIR }}
        run: |
          terraform init -input=false

      - name: Bootstrap Terraform Destroy
        working-directory: ${{ env.TFSTATE_DIR }}
        run: |
          terraform destroy \
            -input=false \
            -auto-approve

      # ========================================================
      # FINAL SAFETY CHECK
      # ========================================================
      - name: Verify Terraform State Resource Group Deleted
        run: |
          echo "Checking Terraform state resource group..."

          if az group show \
            --name "$TFSTATE_RG" \
            >/dev/null 2>&1; then

            echo "❌ Terraform state resource group still exists:"
            echo "$TFSTATE_RG"

            exit 1
          fi

          echo "✅ Terraform state resource group deleted successfully."

      - name: Verify Main Resource Group Deleted
        run: |
          echo "Checking main resource group..."

          if az group show \
            --name "$RESOURCE_GROUP" \
            >/dev/null 2>&1; then

            echo "⚠️ Main resource group still exists:"
            echo "$RESOURCE_GROUP"

            exit 1
          fi

          echo "✅ Main Azure infrastructure cleaned successfully."

      - name: Final Cleanup Summary
        run: |
          echo "=============================================="
          echo "      AZURE DESTROY COMPLETED"
          echo "=============================================="
          echo ""
          echo "Main Resource Group : $RESOURCE_GROUP"
          echo "TF State RG          : $TFSTATE_RG"
          echo "TF State Storage     : $TFSTATE_STORAGE"
          echo "TF State Container   : $TFSTATE_CONTAINER"
          echo ""
          echo "✅ CloudOps infrastructure deleted"
          echo "✅ Terraform state storage deleted"
          echo "✅ Azure cleanup completed"
          echo "=============================================="
